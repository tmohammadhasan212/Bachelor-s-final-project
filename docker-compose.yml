version: '3.8'

services:
  clinical-dashboard:
    build: .
    container_name: heart-risk-ui
    ports:
      - "8501:8501"
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
    restart: unless-stopped

  api-service:
    build: .
    container_name: heart-risk-api
    command: ["uvicorn", "src.heart_risk.api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    restart: unless-stopped
